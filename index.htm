
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10243d">
  <title>Bai Xi 代儲代送｜線上訂購</title>
  <style>
    :root {
      --navy: #10243d;
      --blue: #245783;
      --bg: #f5f7fa;
      --white: #ffffff;
      --line: #dfe5ec;
      --muted: #66758a;
      --text: #1b2a3c;
      --green: #13785d;
      --red: #af3345;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.6;
    }

    button, input, textarea { font: inherit; }

    button { cursor: pointer; }

    .header {
      background: var(--navy);
      color: white;
      padding: 19px max(20px, calc((100vw - 1120px) / 2));
    }

    .brand {
      font-size: 20px;
      font-weight: 750;
      letter-spacing: .4px;
    }

    .brand small {
      display: block;
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: 400;
      color: #c3ceda;
    }

    .container {
      max-width: 1120px;
      margin: 36px auto;
      padding: 0 20px;
    }

    .intro { margin-bottom: 24px; }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(24px, 4vw, 32px);
      color: var(--navy);
    }

    .intro p, .muted { color: var(--muted); }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 22px;
      align-items: start;
    }

    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 3px 15px rgba(19, 39, 61, .035);
    }

    .card h2 {
      margin: 0 0 17px;
      font-size: 19px;
      color: var(--navy);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab {
      padding: 13px;
      background: #f4f6f9;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-weight: 650;
      color: var(--muted);
    }

    .tab.active {
      background: var(--navy);
      color: white;
      border-color: var(--navy);
    }

    .product {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 17px 0;
      border-bottom: 1px solid var(--line);
    }

    .product:last-child { border-bottom: 0; }

    .product-info { min-width: 0; }

    .product-name { font-weight: 650; }

    .price {
      color: var(--blue);
      font-weight: 700;
      margin-top: 4px;
    }

    .tag {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 5px;
      background: #e5f0fc;
      color: #245783;
      margin-top: 6px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 11px;
      flex-shrink: 0;
    }

    .quantity button {
      width: 32px;
      height: 32px;
      background: white;
      border: 1px solid #c9d4e0;
      border-radius: 7px;
      color: var(--navy);
      font-weight: bold;
    }

    .quantity span {
      display: inline-block;
      min-width: 20px;
      text-align: center;
      font-weight: 650;
    }

    .field { margin-bottom: 17px; }

    label {
      display: block;
      font-weight: 650;
      font-size: 14px;
      margin-bottom: 7px;
    }

    .required { color: var(--red); }

    input[type="text"], textarea {
      display: block;
      width: 100%;
      border: 1px solid #cbd5df;
      border-radius: 8px;
      padding: 12px 13px;
      background: white;
      color: var(--text);
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px #24578318;
    }

    textarea { resize: vertical; }

    .hint {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }

    .remember {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: 13px;
      margin: 12px 0;
    }

    .remember input { margin-top: 5px; }

    .summary {
      position: sticky;
      top: 20px;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      font-size: 13px;
      border-bottom: 1px solid #edf0f3;
    }


/* 訂單摘要：商品與刪除按鈕 */

.summary-name {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}

.summary-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.summary-right strong {
  white-space: nowrap;
}

/* 垃圾桶按鈕 */

.remove-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  padding: 0;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  color: #8b97a6;
  transition: all 0.2s ease;
}

.remove-button:hover {
  background: #fff0f0;
  border-color: #f1d0d0;
  color: #c0392b;
}

.remove-button:focus-visible {
  outline: 2px solid #245783;
  outline-offset: 2px;
}


    .total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-top: 1px solid var(--line);
      margin-top: 15px;
    }

    .total strong {
      font-size: 25px;
      color: var(--navy);
    }

    .primary {
      width: 100%;
      background: var(--navy);
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 13px;
      font-weight: 700;
    }

    .primary:hover { background: #1b3b5d; }

    .primary:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .notice {
      background: #f0f5fa;
      color: #475e78;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 12px;
      margin-top: 15px;
    }

    .message {
      font-size: 13px;
      margin: 12px 0;
      color: var(--green);
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 20px 0 35px;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 20, 35, .65);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      z-index: 10;
    }

    .overlay[hidden] { display: none; }

    .modal {
      background: white;
      width: 100%;
      max-width: 520px;
      border-radius: 13px;
      padding: 24px;
      max-height: 90vh;
      overflow: auto;
    }

    .modal h2 { margin-top: 0; }

    .modal textarea {
      min-height: 260px;
      margin: 15px 0;
      font-size: 13px;
    }

    .secondary {
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      width: 100%;
      margin-top: 9px;
    }

    @media (max-width: 780px) {
      .container { margin: 24px auto; }
      .layout { grid-template-columns: 1fr; }
      .card { padding: 19px; }
      .summary { position: static; }
    }

    @media (max-width: 380px) {
      .product { gap: 8px; }
      .quantity { gap: 6px; }
      .quantity button { width: 29px; height: 29px; }
      .product-name { font-size: 13px; }
    }


/* 代送商品次分類 */

.gift-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}

.gift-tabs[hidden] {
  display: none;
}

.gift-tab {
  padding: 12px 8px;
  border: 1px solid #d6e0eb;
  border-radius: 8px;
  background: #ffffff;
  color: #53647a;
  font-size: 14px;
  font-weight: 600;
  transition: background .2s, color .2s;
}

.gift-tab:hover {
  background: #f0f4f8;
}

.gift-tab.active {
  background: #e7eef7;
  color: #10243d;
  border-color: #9bb3cf;
}

.gift-tab:focus-visible {
  outline: 2px solid #245783;
  outline-offset: 2px;
}

  </style>
</head>
<body>

<header class="header">
  <div class="brand">
    Bai Xi 代儲代送
    <small>BAI XI · ORDER SERVICE</small>
  </div>
</header>

<main class="container">
  <div class="intro">
    <h1>線上訂購服務</h1>
    <p>選擇所需商品並填寫遊戲資料，系統將自動計算訂單金額。</p>
  </div>

  <div class="layout">
    <div>
      <section class="card">
        <h2>01｜選擇服務與商品</h2>

    
<!-- 代送服務次分類 -->
<div class="gift-tabs" id="giftTabs" hidden>
  <button
    type="button"
    class="gift-tab"
    data-category="permanent">
    常駐商城代送
  </button>

  <button
    type="button"
    class="gift-tab active"
    data-category="limited">
    限時返場代送
  </button>
</div>


<!-- 主要服務分類 -->
<div class="tabs">
  <button
    type="button"
    class="tab active"
    data-type="topup">
    代儲服務
  </button>

  <button
    type="button"
    class="tab"
    data-type="gift">
    代送服務
  </button>
</div>

<!-- 代送次分類 -->
<div class="gift-tabs" id="giftTabs" hidden>
  <button
    type="button"
    class="gift-tab"
    data-category="permanent">
    常駐商城代送
  </button>

  <button
    type="button"
    class="gift-tab active"
    data-category="limited">
    限時返場代送
  </button>
</div>

<!-- 商品列表 -->
<div id="products"></div>

      </section>

      <section class="card">
        <h2>02｜填寫訂購資料</h2>

        <form id="orderForm">
          <div class="field">
            <label for="fbName">Facebook 名稱 <span class="required">*</span></label>
            <input id="fbName" type="text" required maxlength="80"
                   placeholder="請輸入 Facebook 名稱">
            <div class="hint">曾在此瀏覽器儲存資料的客人，可輸入相同名稱快速填入。</div>
          </div>

          <div class="field">
            <label for="gameNickname">遊戲暱稱 <span class="required">*</span></label>
            <input id="gameNickname" type="text" required maxlength="80"
                   placeholder="請輸入第五人格遊戲內暱稱">
          </div>

          <div class="field">
            <label for="gameId">遊戲 ID <span class="required">*</span></label>
            <input id="gameId" type="text" required maxlength="80"
                   placeholder="請輸入遊戲 ID">
          </div>

          <div class="field">
            <label for="note">訂單備註（選填）</label>
            <textarea id="note" rows="3" maxlength="500"
                      placeholder="有其他需求可以填寫在這裡"></textarea>
          </div>

          <label class="remember">
            <input type="checkbox" id="remember" checked>
            <span>在這台裝置記住我的資料，方便下次購買</span>
          </label>

          <div id="rememberMessage" class="message" aria-live="polite"></div>
        </form>
      </section>
    </div>

    <aside class="card summary">
      <h2>訂單摘要</h2>
      <div id="summaryItems" class="muted">尚未選擇商品</div>

      <div class="total">
        <span>訂單總金額</span>
        <strong id="totalPrice">NT$ 0</strong>
      </div>

      <button class="primary" type="submit" form="orderForm" id="submitButton">
        確認訂單
      </button>

      <div class="notice">
  請確認商品及遊戲資訊正確。
  訂單送出成功後將產生訂單編號，
  店家會依照訂單順序確認與處理。
</div>
    </aside>
  </div>
</main>

<footer class="footer">
  © 2026 Bai Xi 代儲代送 · All Rights Reserved.
</footer>

<div class="overlay" id="resultOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <h2 id="resultTitle">訂單內容</h2>
    <p class="muted">訂單已送出，請保留訂單編號。</p>
    <textarea id="orderResult" readonly></textarea>
    <button class="primary" id="copyOrder" type="button">複製訂單內容</button>
    <button class="secondary" id="closeModal" type="button">關閉</button>
  </div>
</div>

<script>
  // ==================================================
  // 商品設定：之後可以改為讀取 Google 試算表
  // ==================================================


const API_URL = "https://script.google.com/macros/s/AKfycbxgeXd0BF2BvfNAMGMDc8uOoxFxPr48CRuzKZngOFoonrVc_IFpa8_aei9ejd2UFwveTA/exec";

let PRODUCTS = [];

async function loadProducts() {
  const container = document.getElementById("products");

  container.textContent = "正在載入商品資料...";

  try {
    const data = await loadProductsJSONP();

    if (!data.success || !Array.isArray(data.products)) {
      throw new Error(data.message || "商品資料格式錯誤");
    }


PRODUCTS = data.products.map(p => ({
  id: p.id,
  type: p.type,
  category: p.category || (
    p.type === "gift" ? "limited" : "topup"
  ),
  name: p.name,
  price: Number(p.price),
  startDate: p.startDate || "",
  endDate: p.endDate || "",
  status: p.status
}));


    renderProducts();
    renderSummary();

  } catch (error) {
    console.error("商品載入失敗：", error);
    container.textContent =
      "商品載入失敗，請稍後重新整理網頁。";
  }
}

function loadProductsJSONP() {
  return new Promise((resolve, reject) => {
    const callbackName = "baixiCallback" + Date.now();
    const script = document.createElement("script");

    let settled = false;

    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error("讀取商品逾時"));
    }, 15000);

    function cleanup() {
      clearTimeout(timeout);
      script.remove();
      delete window[callbackName];
    }

    window[callbackName] = data => {
      if (settled) return;
      settled = true;
      cleanup();
      resolve(data);
    };

    script.onerror = () => {
      if (settled) return;
      settled = true;
      cleanup();
      reject(new Error("無法連接商品 API"));
    };

    script.src = API_URL
      + "?action=products&callback="
      + encodeURIComponent(callbackName)
      + "&t=" + Date.now();

    document.head.appendChild(script);
  });
}


  let currentType = "topup";


let currentGiftCategory = "limited";

document.querySelectorAll(".gift-tab").forEach(button => {
  button.addEventListener("click", () => {
    currentGiftCategory = button.dataset.category;

    document.querySelectorAll(".gift-tab").forEach(tab => {
      tab.classList.toggle(
        "active",
        tab.dataset.category === currentGiftCategory
      );
    });

    renderProducts();
    renderSummary();
  });
});

  const cart = {};

  const $ = id => document.getElementById(id);
  const money = n => "NT$ " + n.toLocaleString("zh-TW");

  function taiwanToday() {
    const parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Taipei",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(new Date());

    const p = Object.fromEntries(
      parts.map(item => [item.type, item.value])
    );

    return `${p.year}-${p.month}-${p.day}`;
  }

  function isAvailable(product) {
    // 同一天到 00:00 就停止販售
    return !product.endDate || taiwanToday() < product.endDate;
  }

  function isPreorder(product) {
    return Boolean(product.startDate &&
      taiwanToday() < product.startDate);
  }

  function createText(tag, className, text) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    el.textContent = text;
    return el;
  }

  function renderProducts() {
    const container = $("products");
    container.replaceChildren();


const list = PRODUCTS.filter(p => {
  if (!isAvailable(p)) return false;

  if (currentType === "topup") {
    return p.type === "topup";
  }

  return p.type === "gift" &&
    p.category === currentGiftCategory;
});


    if (!list.length) {
      container.append(
        createText("p", "muted", "目前沒有可購買的商品。")
      );
      return;
    }

    list.forEach(p => {
      const row = createText("div", "product", "");
      const info = createText("div", "product-info", "");
      info.append(
        createText("div", "product-name", p.name),
        createText("div", "price", money(p.price))
      );

      if (isPreorder(p)) {
        info.append(createText("span", "tag", "預購中"));
      }

      const quantity = createText("div", "quantity", "");

      const minus = createText("button", "", "−");
      minus.type = "button";
      minus.setAttribute("aria-label", `減少${p.name}數量`);

      const amount = createText("span", "", String(cart[p.id] || 0));

      const plus = createText("button", "", "+");
      plus.type = "button";
      plus.setAttribute("aria-label", `增加${p.name}數量`);

      minus.addEventListener("click", () => changeQuantity(p.id, -1));
      plus.addEventListener("click", () => changeQuantity(p.id, 1));

      quantity.append(minus, amount, plus);
      row.append(info, quantity);
      container.append(row);
    });
  }

  function changeQuantity(id, delta) {
    const p = PRODUCTS.find(item => item.id === id);
    if (!p || !isAvailable(p)) return;

    cart[id] = Math.max(0, Math.min(99, (cart[id] || 0) + delta));
    renderProducts();
    renderSummary();
  }

  function selectedProducts() {
    return PRODUCTS.filter(p =>
      p.type === currentType &&
      isAvailable(p) &&
      (cart[p.id] || 0) > 0
    );
  }


function renderSummary() {
  const items = selectedProducts();
  const target = $("summaryItems");
  target.replaceChildren();

  if (items.length === 0) {
    target.append(
      createText("p", "muted", "尚未選擇商品")
    );
  } else {
    items.forEach(p => {
      const line = createText("div", "summary-line", "");

      const name = createText(
        "span",
        "summary-name",
        `${p.name} × ${cart[p.id]}`
      );

      const right = createText("div", "summary-right", "");

      const price = createText(
        "strong",
        "",
        money(p.price * cart[p.id])
      );

      // 刪除商品按鈕
      const removeButton = document.createElement("button");
      removeButton.type = "button";
      removeButton.className = "remove-button";
      removeButton.title = "移除商品";
      removeButton.setAttribute(
        "aria-label",
        `移除 ${p.name}`
      );

      // 垃圾桶 SVG 圖示
      removeButton.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg"
             width="17" height="17"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="1.8"
             stroke-linecap="round"
             stroke-linejoin="round"
             aria-hidden="true">
          <path d="M3 6h18"/>
          <path d="M8 6V4h8v2"/>
          <path d="M19 6l-1 14H6L5 6"/>
          <path d="M10 10v6"/>
          <path d="M14 10v6"/>
        </svg>
      `;

      removeButton.addEventListener("click", () => {
        cart[p.id] = 0;

        renderProducts();
        renderSummary();
      });

      right.append(price, removeButton);
      line.append(name, right);
      target.append(line);
    });
  }

  const total = items.reduce(
    (sum, p) => sum + p.price * cart[p.id],
    0
  );

  $("totalPrice").textContent = money(total);
  $("submitButton").disabled = items.length === 0;
}




function changeType(type) {
  currentType = type;

  document.querySelectorAll(".tab").forEach(btn => {
    btn.classList.toggle(
      "active",
      btn.dataset.type === type
    );
  });

  $("giftTabs").hidden = type !== "gift";

  renderProducts();
  renderSummary();
}



  document.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => {
      changeType(btn.dataset.type);
    });
  });

  // ==================================================
  // 回購資料：僅儲存在客人自己的瀏覽器
  // ==================================================

  const MEMORY_KEY = "baixi_customer_v1";

  function normalizeName(name) {
    return name.trim().toLocaleLowerCase();
  }

  function readMemory() {
    try {
      return JSON.parse(localStorage.getItem(MEMORY_KEY) || "{}");
    } catch {
      return {};
    }
  }

  function fillSavedCustomer() {
    const name = normalizeName($("fbName").value);
    const saved = readMemory()[name];

    if (saved) {
      $("gameNickname").value = saved.gameNickname || "";
      $("gameId").value = saved.gameId || "";
      $("rememberMessage").textContent = "已帶入這台裝置上次儲存的資料。";
    } else {
      $("rememberMessage").textContent = "";
    }
  }

  $("fbName").addEventListener("change", fillSavedCustomer);

  function saveCustomer() {
    if (!$("remember").checked) return;

    try {
      const data = readMemory();
      const key = normalizeName($("fbName").value);

      data[key] = {
        gameNickname: $("gameNickname").value.trim(),
        gameId: $("gameId").value.trim()
      };

      localStorage.setItem(MEMORY_KEY, JSON.stringify(data));
    } catch {
      // 瀏覽器可能禁止儲存，本次訂單仍可產生
    }
  }

  // ==================================================
  
  // ==========================================
  // Bai Xi 訂單傳送系統
  // ==========================================

  let pendingOrder = null;

  // 查詢訂單是否成功寫入 Google 試算表
  function checkOrderReceipt(requestId) {
    return new Promise((resolve, reject) => {
      const callbackName =
        "baixiReceipt_" +
        Date.now() + "_" +
        Math.floor(Math.random() * 100000);

      const script = document.createElement("script");
      let finished = false;

      const timer = setTimeout(() => {
        finish(new Error("查詢逾時"));
      }, 10000);

      function finish(error, data) {
        if (finished) return;
        finished = true;
        clearTimeout(timer);
        script.remove();
        delete window[callbackName];

        if (error) reject(error);
        else resolve(data);
      }

      window[callbackName] = data => finish(null, data);

      script.onerror = () => {
        finish(new Error("訂單查詢失敗"));
      };

      const url = new URL(API_URL);
      url.searchParams.set("action", "receipt");
      url.searchParams.set("requestId", requestId);
      url.searchParams.set("callback", callbackName);
      url.searchParams.set("t", Date.now());

      script.src = url.toString();
      document.head.appendChild(script);
    });
  }

  // 傳送訂單至 Google Apps Script
  async function submitOrderToSheet(order) {
    const body = new URLSearchParams();
    body.set("order", JSON.stringify(order));

    try {
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        body: body
      });
    } catch (error) {
      console.warn("無法確認傳送結果：", error);
    }

    // 因為 no-cors 無法讀取 POST 回應，
    // 必須另行查詢訂單是否真的儲存。
    for (let i = 0; i < 12; i++) {
      await new Promise(resolve => setTimeout(resolve, 1500));

      try {
        const receipt = await checkOrderReceipt(order.requestId);

        if (receipt.success && receipt.confirmed) {
          return receipt;
        }

        if (receipt.success === false) {
          throw new Error(receipt.message || "訂單查詢失敗");
        }
      } catch (error) {
        console.warn("訂單確認查詢：", error);
      }
    }

    throw new Error(
      "無法確認訂單是否成功。請先聯繫店家確認，避免重複下單。"
    );
  }

  // 取得目前的訂單資料
  function buildCurrentOrder() {
    const items = selectedProducts();

    if (!items.length) {
      throw new Error("請先選擇商品");
    }

    const fbName = $("fbName").value.trim();
    const gameNickname = $("gameNickname").value.trim();
    const gameId = $("gameId").value.trim();
    const note = $("note").value.trim();

    if (!fbName || !gameNickname || !gameId) {
      throw new Error("請填寫完整的訂購資料");
    }

    return {
      type: currentType,
      fbName,
      gameNickname,
      gameId,
      note,
      items: items.map(p => ({
        id: p.id,
        quantity: cart[p.id]
      }))
    };
  }

  // 按下確認訂單
  $("orderForm").addEventListener("submit", async event => {
    event.preventDefault();

    const button = $("submitButton");

    if (button.dataset.sending === "true") return;

    try {
      // 每次送單前確認商品是否過期
      const expired = PRODUCTS.filter(p =>
        p.type === currentType &&
        (cart[p.id] || 0) > 0 &&
        !isAvailable(p)
      );

      if (expired.length) {
        expired.forEach(p => cart[p.id] = 0);
        renderProducts();
        renderSummary();
        throw new Error("部分商品已下架，請重新確認訂單");
      }

      // 若前一筆送單結果未確認，先查詢，避免重複建立。
      if (pendingOrder) {
        const previous = await checkOrderReceipt(
          pendingOrder.requestId
        );

        if (previous.success && previous.confirmed) {
          showOrderSuccess(previous);
          return;
        }

        const current = buildCurrentOrder();

        const sameOrder = JSON.stringify(current) ===
          JSON.stringify(pendingOrder.data);

        if (!sameOrder) {
          throw new Error(
            "上一筆訂單尚未確認，請先聯繫店家確認，再修改訂單。"
          );
        }
      } else {
        const data = buildCurrentOrder();

        pendingOrder = {
          requestId: crypto.randomUUID(),
          data
        };
      }

      button.dataset.sending = "true";
      button.disabled = true;
      button.textContent = "訂單傳送中...";

      const result = await submitOrderToSheet({
        requestId: pendingOrder.requestId,
        ...pendingOrder.data
      });

      showOrderSuccess(result);

    } catch (error) {
      console.error(error);
      alert(error.message || "訂單處理失敗");

    } finally {
      button.dataset.sending = "false";
      button.textContent = "確認訂單";
      renderSummary();
    }
  });

  // 訂單成功後顯示結果
 
function showOrderSuccess(result) {
  saveCustomer();

  // 台灣時間
  const createdAt = new Intl.DateTimeFormat("zh-TW", {
    timeZone: "Asia/Taipei",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  }).format(new Date());

  // 取得訂單品項
  const orderItems = pendingOrder.data.items.map(item => {
    const product = PRODUCTS.find(p => p.id === item.id);

    return product
      ? `${product.name} × ${item.quantity}`
      : `商品 × ${item.quantity}`;
  }).join("\n");

  // 顧客複製的訂單文字
  const text = [
    "【Bai Xi 代儲代送】",
    "",
    "FB名稱：" + pendingOrder.data.fbName,
    "建立時間：" + createdAt,
    "訂單品項：",
    orderItems,
    "訂單金額：NT$ " +
      Number(result.total).toLocaleString("zh-TW"),
    "",
  ].join("\n");

  $("orderResult").value = text;

  document.querySelector(
    "#resultOverlay .modal p"
  ).textContent =
    "訂單已成功送出，請複製以下內容並傳送至聊天室。";

  $("resultOverlay").hidden = false;
  $("copyOrder").textContent = "複製訂單內容";

  // 成功後清空購物車
  pendingOrder.data.items.forEach(item => {
    cart[item.id] = 0;
  });

  pendingOrder = null;

  renderProducts();
  renderSummary();
}


  $("copyOrder").addEventListener("click", async () => {
    const text = $("orderResult").value;

    try {
      await navigator.clipboard.writeText(text);
    } catch {
      $("orderResult").select();
      document.execCommand("copy");
    }

    $("copyOrder").textContent = "已嘗試複製，請確認剪貼簿";
  });

  $("closeModal").addEventListener("click", () => {
    $("resultOverlay").hidden = true;
  });

  // 跨越午夜時，重新檢查下架日期
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
      renderProducts();
      renderSummary();
    }
  });

  setInterval(() => {
    renderProducts();
    renderSummary();
  }, 30000);

changeType("topup");
loadProducts();
</script>
